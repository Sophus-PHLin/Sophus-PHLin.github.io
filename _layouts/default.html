<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">

    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        }
      };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  </head>
  <body>
    <main>
      <header>
        <strong><a href="{{ '/' | relative_url }}">{{ site.title }}</a></strong>
        · <a href="{{ '/about.html' | relative_url }}">About</a>
        · <a href="{{ '/archive.html' | relative_url }}">Writing</a>
        <hr>
      </header>

      {{ content }}
    </main>
  </body>
</html>
